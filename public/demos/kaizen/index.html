<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaizen</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">

    <nav id="sidebar">
      <div id="sidebar-logo">
        <span class="logo-text">KAIZEN</span>
        <span class="logo-sub">Contabilidad</span>
      </div>

      <ul id="nav-links">
        <li class="nav-item active" data-view="ventas">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Nueva Venta
        </li>
        <li class="nav-item" data-view="productos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          Productos
        </li>
        <li class="nav-item" data-view="historial">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Historial
        </li>
        <li class="nav-item" data-view="egresos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 19 19 12"/></svg>
          Egresos
        </li>
        <li class="nav-item" data-view="usuarios">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Usuarios
        </li>
        <li class="nav-item" data-view="codigos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
          Promociones
        </li>
        <li class="nav-item" data-view="configuracion">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Configuración
        </li>
      </ul>

      <div id="sidebar-caja" style="padding:14px 16px; border-top:1px solid var(--border)">
        <div style="font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px">Cajero</div>
        <div id="caja-cajero" style="font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px">—</div>
        <div style="font-size:10px; color:var(--muted); margin-bottom:10px">Apertura: <span id="caja-hora">—</span></div>
        <button id="btn-cerrar-caja" class="btn btn-danger" style="width:100%; font-size:12px; padding:7px">Cerrar Caja</button>
      </div>

      <div id="sidebar-user">
        <button id="btn-logout" class="btn btn-ghost" style="font-size:12px">Salir</button>
      </div>
    </nav>

    <main id="content"></main>
  </div>

  <!-- Overlay Abrir Caja -->
  <div id="overlay-caja" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:9999; align-items:center; justify-content:center; flex-direction:column">
    <span class="logo-text" style="font-size:34px; letter-spacing:8px; margin-bottom:6px">KAIZEN</span>
    <span style="font-size:11px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-bottom:44px">Contabilidad</span>
    <div class="card" style="width:340px">
      <h2 style="color:var(--gold); font-size:18px; font-weight:700; margin-bottom:6px">Abrir Caja</h2>
      <p style="font-size:12px; color:var(--muted); margin-bottom:24px; line-height:1.6">Inicia una sesión de caja para comenzar a registrar ventas del turno.</p>
      <button class="btn btn-gold" id="btn-abrir-caja" style="width:100%; padding:14px; font-size:15px; font-weight:700; letter-spacing:1px">ABRIR CAJA</button>
    </div>
  </div>

  <script src="js/mock-api.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/ventas.js"></script>
  <script src="js/views/productos.js"></script>
  <script src="js/views/historial.js"></script>
  <script src="js/views/egresos.js"></script>
  <script src="js/views/usuarios.js"></script>
  <script src="js/views/codigos.js"></script>
  <script src="js/views/configuracion.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
